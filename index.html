<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- The icon iPhones and iPads use when someone saves the site to their home screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robert Anderson | UX Designer &amp; Front-End Developer</title>

    <!-- Geist font from Google Fonts. "preconnect" opens the connection early so the font loads faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Hidden copy of the contact form, for Netlify only. Visitors never see it.
      Netlify finds forms by reading the HTML files at deploy time, but React builds the
      real form later with JavaScript, so Netlify can't see that one. This copy registers a
      form named "contact" with these fields. The React form (src/components/ContactForm.tsx)
      must use the SAME form name and field names, or submissions won't arrive.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
